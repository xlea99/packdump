org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parameter names and javadoc on top of Mojang's mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Matches the Deep End instance. Versions: https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.264
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

mod_id=packdump
mod_name=packdump
mod_license=MPL-2.0
mod_version=1.0.0+1.21.1
mod_group_id=net.xlea99
mod_authors=xlea99
mod_description=Dumps a modpack's registries, names, block items and textures for PackSmith.
